# Netlify configuration for ImpACT Tours and Travel
# Static marketing site - no build step required.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fingerprinted image assets can be cached hard.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------------
# School trip pages are served straight from this repo (trips/<slug>/),
# so the old cross-site redirects are gone.
# ------------------------------------------------------------------

# Legal alias used by the folded-in trip pages.
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301

# Registration portal still lives in its own repo and deploy.
[[redirects]]
  from = "/register"
  to = "https://impact-registration.netlify.app/register/"
  status = 301

[[redirects]]
  from = "/register/*"
  to = "https://impact-registration.netlify.app/register/:splat"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
